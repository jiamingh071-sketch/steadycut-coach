name: Signed Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      STEADYCUT_KEYSTORE_PASSWORD: ${{ secrets.STEADYCUT_KEYSTORE_PASSWORD }}
      STEADYCUT_KEY_ALIAS: ${{ secrets.STEADYCUT_KEY_ALIAS }}
      STEADYCUT_KEY_PASSWORD: ${{ secrets.STEADYCUT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STEADYCUT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STEADYCUT_KEYSTORE_PASSWORD"
          test -n "$STEADYCUT_KEY_ALIAS"
          test -n "$STEADYCUT_KEY_PASSWORD"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STEADYCUT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/steadycut-release.jks"
          echo "STEADYCUT_KEYSTORE_PATH=$RUNNER_TEMP/steadycut-release.jks" >> "$GITHUB_ENV"
      - name: Build and inspect release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintRelease assembleRelease --stacktrace
      - name: Name package and create checksum
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/SteadyCut-${GITHUB_REF_NAME}-android.apk
          cd release
          sha256sum SteadyCut-${GITHUB_REF_NAME}-android.apk > SteadyCut-${GITHUB_REF_NAME}-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SteadyCut-${{ github.ref_name }}-signed-apk
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
