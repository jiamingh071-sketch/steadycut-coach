<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="12周减脂保肌训练、饮食与进度追踪工具">
  <title>稳进 · 12周减脂保肌</title>
  <style>
    :root {
      color-scheme: light;
      --ink-950: oklch(20% 0.018 255);
      --ink-800: oklch(34% 0.018 255);
      --ink-600: oklch(48% 0.018 255);
      --ink-300: oklch(78% 0.012 255);
      --ink-150: oklch(90% 0.009 255);
      --ink-75: oklch(96% 0.006 255);
      --paper: oklch(98.5% 0.004 255);
      --accent-700: oklch(55% 0.19 43);
      --accent-600: oklch(62% 0.19 43);
      --accent-100: oklch(94% 0.04 43);
      --positive: oklch(54% 0.14 153);
      --negative: oklch(55% 0.18 25);
      --warning: oklch(62% 0.14 82);
      --bg: var(--ink-75);
      --surface: var(--paper);
      --surface-soft: oklch(94% 0.009 255);
      --text: var(--ink-950);
      --text-soft: var(--ink-600);
      --border: var(--ink-150);
      --border-strong: var(--ink-300);
      --accent: var(--accent-600);
      --accent-hover: var(--accent-700);
      --accent-soft: var(--accent-100);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --radius: 12px;
      --font-sans: Aptos, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: oklch(17% 0.012 255);
      --surface: oklch(21% 0.012 255);
      --surface-soft: oklch(25% 0.014 255);
      --text: oklch(93% 0.008 255);
      --text-soft: oklch(72% 0.014 255);
      --border: oklch(31% 0.015 255);
      --border-strong: oklch(43% 0.018 255);
      --accent: oklch(72% 0.17 48);
      --accent-hover: oklch(78% 0.15 48);
      --accent-soft: oklch(29% 0.06 43);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-top: 88px; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: var(--accent-hover); }
    h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
    p { margin: 0; text-wrap: pretty; }
    .skip-link { position: fixed; left: var(--space-4); top: -80px; z-index: 1000; background: var(--surface); padding: var(--space-3); }
    .skip-link:focus { top: var(--space-4); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { width: min(1180px, calc(100% - 32px)); margin-inline: auto; }
    .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in oklch, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); backdrop-filter: blur(16px); }
    .topbar-inner { height: 72px; display: flex; align-items: center; gap: var(--space-6); }
    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: max-content; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--radius); background: var(--accent); color: oklch(98% 0 0); font: 800 13px/1 var(--font-mono); letter-spacing: -0.05em; }
    .brand-copy strong { display: block; font-size: 16px; }
    .brand-copy span { display: block; color: var(--text-soft); font-size: 12px; }
    .desktop-nav { display: flex; align-items: center; gap: var(--space-1); margin-left: auto; }
    .nav-link { min-height: 44px; display: inline-flex; align-items: center; padding: 0 var(--space-4); border: 0; border-radius: var(--radius); background: transparent; color: var(--text-soft); text-decoration: none; font-weight: 650; cursor: pointer; }
    .nav-link:hover, .nav-link[aria-current="page"] { background: var(--surface-soft); color: var(--text); }
    .nav-link[aria-current="page"] { box-shadow: inset 0 -2px var(--accent); }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
    .icon-button:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .icon-button:active, .button:active { transform: scale(.97); }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    main { padding: var(--space-8) 0 104px; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: var(--space-6); margin-bottom: var(--space-8); }
    .page-head h1 { font-size: clamp(30px, 5vw, 48px); letter-spacing: -0.035em; }
    .page-head p { max-width: 46ch; color: var(--text-soft); }
    .eyebrow { margin-bottom: var(--space-2); color: var(--accent-hover); font: 700 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
    .date-line { color: var(--text-soft); font-size: 14px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .panel-pad { padding: var(--space-6); }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
    .panel-title h2 { font-size: 20px; }
    .muted { color: var(--text-soft); }
    .small { font-size: 13px; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .stack { display: grid; gap: var(--space-4); }
    .stack-lg { display: grid; gap: var(--space-6); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); gap: var(--space-6); align-items: start; }
    .metric-strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--space-6); overflow: hidden; }
    .metric { padding: var(--space-4) var(--space-6); border-right: 1px solid var(--border); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--text-soft); font-size: 13px; }
    .metric-value { margin-top: var(--space-1); font: 750 clamp(23px, 4vw, 32px)/1.2 var(--font-mono); letter-spacing: -.04em; }
    .metric-target { color: var(--text-soft); font: 500 12px/1.4 var(--font-mono); }
    .progress { height: 8px; margin-top: var(--space-3); background: var(--surface-soft); border-radius: var(--radius); overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .progress > span.over { background: var(--negative); }

    .focus-block { display: grid; grid-template-columns: 1fr auto; gap: var(--space-6); align-items: center; padding: var(--space-8); background: var(--ink-950); color: oklch(94% 0.008 255); border-radius: var(--radius); }
    [data-theme="dark"] .focus-block { background: oklch(27% 0.02 255); }
    .focus-block h2 { font-size: clamp(24px, 4vw, 38px); letter-spacing: -.03em; }
    .focus-block p { max-width: 50ch; margin-top: var(--space-3); color: oklch(76% 0.012 255); }
    .focus-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
    .chip { display: inline-flex; min-height: 32px; align-items: center; padding: 0 var(--space-3); border-radius: var(--radius); background: color-mix(in oklch, currentColor 10%, transparent); font-size: 13px; font-weight: 650; }
    .focus-number { min-width: 112px; text-align: right; }
    .focus-number strong { display: block; color: var(--accent); font: 800 52px/1 var(--font-mono); letter-spacing: -.07em; }
    .focus-number span { color: oklch(76% 0.012 255); font-size: 13px; }

    .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 0 var(--space-6); border: 1px solid transparent; border-radius: var(--radius); background: var(--accent); color: oklch(98% 0 0); font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; transition: transform 100ms ease-out, background 150ms ease-out, border-color 150ms ease-out; }
    .button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .button.secondary { background: var(--surface-soft); color: var(--text); border-color: var(--border); }
    .button.secondary:hover { border-color: var(--border-strong); }
    .button.ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
    .button.danger { background: var(--negative); }
    .button.small-button { min-height: 36px; padding-inline: var(--space-4); font-size: 13px; }
    .button:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    .button-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .form-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .field { display: grid; gap: var(--space-2); }
    .field.full { grid-column: 1 / -1; }
    label, .label { color: var(--text-soft); font-size: 14px; font-weight: 650; }
    input, select, textarea { width: 100%; min-height: 48px; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); transition: border-color 150ms ease-out; }
    input:hover, select:hover, textarea:hover { border-color: var(--text-soft); }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input[type="checkbox"] { width: 22px; min-height: 22px; accent-color: var(--accent); }
    textarea { min-height: 96px; resize: vertical; }
    .checkline { display: flex; gap: var(--space-3); align-items: center; min-height: 44px; }
    .input-help { color: var(--text-soft); font-size: 12px; }
    .error-text { min-height: 18px; color: var(--negative); font-size: 13px; }

    .setup-banner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: var(--space-4) var(--space-6); margin-bottom: var(--space-6); border: 1px solid color-mix(in oklch, var(--accent) 42%, var(--border)); border-radius: var(--radius); background: var(--accent-soft); }
    .setup-banner strong { display: block; margin-bottom: var(--space-1); }
    .setup-banner p { color: color-mix(in oklch, var(--text) 72%, var(--accent)); font-size: 14px; }
    .list { margin: 0; padding-left: 1.25rem; }
    .list li + li { margin-top: var(--space-2); }
    .rule-list { display: grid; gap: var(--space-3); }
    .rule { display: grid; grid-template-columns: 32px 1fr; gap: var(--space-3); align-items: start; }
    .rule-index { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius); background: var(--surface-soft); color: var(--accent-hover); font: 700 13px/1 var(--font-mono); }

    .day-tabs { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-2); margin-bottom: var(--space-6); scrollbar-width: thin; }
    .day-tab { min-height: 44px; min-width: max-content; padding: 0 var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
    .day-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: oklch(98% 0 0); }
    .exercise-list { display: grid; gap: var(--space-4); }
    .exercise { padding: var(--space-4); border-top: 1px solid var(--border); }
    .exercise:first-child { border-top: 0; }
    .exercise-head { display: flex; align-items: start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
    .exercise-head h3 { font-size: 17px; }
    .prescription { color: var(--text-soft); font: 600 13px/1.4 var(--font-mono); }
    .progression-note { margin-top: var(--space-1); color: var(--accent-hover); font-size: 12px; }
    .set-table { display: grid; grid-template-columns: 52px repeat(3, minmax(64px, 92px)) 56px; gap: var(--space-2); align-items: center; }
    .set-table .th { color: var(--text-soft); font-size: 12px; text-align: center; }
    .set-number { text-align: center; font: 650 13px/1 var(--font-mono); }
    .set-table input[type="number"] { min-height: 40px; padding: var(--space-2); text-align: center; }
    .set-table input[type="checkbox"] { justify-self: center; }
    .session-meta { display: grid; grid-template-columns: 180px 140px 1fr auto; gap: var(--space-4); align-items: end; padding: var(--space-6); border-bottom: 1px solid var(--border); }

    .guide-intro { display: flex; align-items: start; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border); background: var(--surface-soft); }
    .guide-intro strong { display: block; margin-bottom: var(--space-1); }
    .guide-intro p { color: var(--text-soft); font-size: 13px; }
    .exercise-guide { margin-top: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-soft); overflow: hidden; }
    .exercise-guide summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-4); color: var(--text); font-weight: 700; cursor: pointer; list-style: none; }
    .exercise-guide summary::-webkit-details-marker { display: none; }
    .exercise-guide summary:hover { background: color-mix(in oklch, var(--accent) 7%, var(--surface-soft)); }
    .guide-summary-copy { display: flex; align-items: center; gap: var(--space-3); }
    .guide-play { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent-hover); }
    .guide-play svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .guide-meta { color: var(--text-soft); font-size: 12px; font-weight: 600; }
    .guide-chevron { width: 20px; height: 20px; color: var(--text-soft); transition: transform 180ms ease-out; }
    .exercise-guide[open] .guide-chevron { transform: rotate(180deg); }
    .exercise-guide + .set-table { margin-top: var(--space-4); }
    .guide-body { display: grid; grid-template-columns: minmax(240px, .78fr) minmax(0, 1.22fr); gap: var(--space-6); padding: var(--space-6); border-top: 1px solid var(--border); background: var(--surface); }
    .guide-visual { display: grid; align-content: start; gap: var(--space-3); }
    .guide-figure { min-height: 188px; display: grid; place-items: center; padding: var(--space-3); border-radius: var(--radius); background: var(--surface-soft); color: var(--text); }
    .guide-figure svg { width: 100%; max-width: 360px; height: auto; overflow: visible; }
    .figure-line { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .figure-thin { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .figure-ghost { fill: none; stroke: var(--text-soft); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 6; opacity: .7; }
    .figure-accent { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .figure-equipment { fill: none; stroke: var(--border-strong); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .figure-label { fill: var(--text-soft); font: 600 11px/1 var(--font-sans); }
    .guide-targets { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .guide-targets span { min-height: 30px; display: inline-flex; align-items: center; padding: 0 var(--space-3); border-radius: var(--radius); background: var(--accent-soft); color: var(--accent-hover); font-size: 12px; font-weight: 700; }
    .guide-copy { display: grid; gap: var(--space-4); }
    .guide-block { padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
    .guide-block:last-child { padding-bottom: 0; border-bottom: 0; }
    .guide-block h4 { margin: 0 0 var(--space-2); font-size: 14px; }
    .guide-steps { margin: 0; padding-left: 1.25rem; color: var(--text-soft); font-size: 14px; }
    .guide-steps li + li { margin-top: var(--space-2); }
    .guide-cue { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .guide-cue p { color: var(--text-soft); font-size: 13px; }
    .guide-cue strong { display: block; margin-bottom: var(--space-1); color: var(--text); }
    .guide-warning { padding: var(--space-3) var(--space-4); border-radius: var(--radius); background: color-mix(in oklch, var(--warning) 12%, var(--surface)); color: color-mix(in oklch, var(--text) 82%, var(--warning)); font-size: 13px; }

    .status { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius); font-size: 13px; font-weight: 700; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status.good { color: var(--positive); background: color-mix(in oklch, var(--positive) 12%, transparent); }
    .status.warn { color: var(--warning); background: color-mix(in oklch, var(--warning) 12%, transparent); }
    .status.bad { color: var(--negative); background: color-mix(in oklch, var(--negative) 12%, transparent); }
    .status.info { color: var(--accent-hover); background: var(--accent-soft); }

    .chart { min-height: 230px; display: grid; place-items: center; overflow: hidden; }
    .chart svg { width: 100%; height: 230px; overflow: visible; }
    .chart-grid { stroke: var(--border); stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
    .chart-label { fill: var(--text-soft); font: 11px var(--font-mono); }
    .chart-empty { color: var(--text-soft); text-align: center; padding: var(--space-8); }
    .timeline { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--space-2); }
    .week-node { min-height: 64px; display: grid; place-items: center; gap: var(--space-1); padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); text-align: center; }
    .week-node.current { border-color: var(--accent); background: var(--accent-soft); }
    .week-node.done { background: var(--surface-soft); color: var(--text-soft); }
    .week-node strong { font: 700 14px/1 var(--font-mono); }
    .week-node span { font-size: 11px; }
    .data-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--text-soft); font-size: 12px; }
    td { font-size: 14px; }
    .empty { padding: var(--space-8); text-align: center; color: var(--text-soft); }
    .empty strong { display: block; color: var(--text); margin-bottom: var(--space-2); }
    .callout { padding: var(--space-6); border-radius: var(--radius); background: var(--surface-soft); }
    .callout h3 { margin-bottom: var(--space-2); font-size: 18px; }
    .callout p + p { margin-top: var(--space-3); }
    .danger-zone { border-color: color-mix(in oklch, var(--negative) 45%, var(--border)); }
    .source-list { display: grid; gap: var(--space-2); font-size: 14px; }

    .bottom-nav { display: none; }
    .toast-region { position: fixed; right: var(--space-6); bottom: var(--space-6); z-index: 100; display: grid; gap: var(--space-2); }
    .toast { max-width: 360px; padding: var(--space-3) var(--space-4); border-radius: var(--radius); background: var(--ink-950); color: oklch(96% 0 0); transform: translateY(8px); opacity: 0; transition: transform 180ms ease-out, opacity 180ms ease-out; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: var(--negative); }

    @media (max-width: 900px) {
      .desktop-nav { display: none; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .metric-strip { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .timeline { grid-template-columns: repeat(6, 1fr); }
      .session-meta { grid-template-columns: 1fr 1fr; }
      .session-meta .button { grid-column: 1 / -1; }
      .guide-body { grid-template-columns: 1fr; }
      .bottom-nav { position: fixed; inset: auto 0 0; z-index: 50; display: grid; grid-template-columns: repeat(5, 1fr); padding: var(--space-2) max(var(--space-2), env(safe-area-inset-right)) max(var(--space-2), env(safe-area-inset-bottom)) max(var(--space-2), env(safe-area-inset-left)); background: color-mix(in oklch, var(--surface) 94%, transparent); border-top: 1px solid var(--border); backdrop-filter: blur(16px); }
      .bottom-nav a { min-height: 48px; display: grid; place-items: center; border-radius: var(--radius); color: var(--text-soft); font-size: 12px; font-weight: 700; text-decoration: none; }
      .bottom-nav a[aria-current="page"] { color: var(--accent-hover); background: var(--accent-soft); }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 24px, 1180px); }
      .topbar-inner { height: 64px; }
      .brand-copy span { display: none; }
      main { padding-top: var(--space-6); }
      .page-head { display: grid; align-items: start; margin-bottom: var(--space-6); }
      .page-head h1 { font-size: 32px; }
      .metric { padding: var(--space-4); }
      .metric-value { font-size: 24px; }
      .focus-block { grid-template-columns: 1fr; padding: var(--space-6); }
      .focus-number { text-align: left; }

    const pad = value => String(value).padStart(2, '0');
    const localISO = (date = new Date()) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const parseLocal = value => { const [y, m, d] = value.split('-').map(Number); return new Date(y, m - 1, d); };
    const plusDays = (value, days) => { const date = parseLocal(value); date.setDate(date.getDate() + days); return localISO(date); };
    const nextMonday = () => { const date = new Date(); const shift = (8 - date.getDay()) % 7 || 7; date.setDate(date.getDate() + shift); return localISO(date); };
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const round = (value, digits = 1) => Number(value).toFixed(digits).replace(/\.0$/, '');
    const fmtDate = value => parseLocal(value).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    const escapeHTML = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);

    function defaultState() {
      return {
        version: 1,
        profile: {
          name: '', sex: '男', age: 20, height: 174, startDate: nextMonday(),
          startWeight: null, startWaist: null,

          stepOverride: null, runOverride: null, lowImpactMode: false
        },
        daily: {}, workouts: {}, measurements: [], selectedTrainingDay: 'upperA'
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const saved = JSON.parse(raw);
        const base = defaultState();
        return {
          ...base, ...saved,
          profile: { ...base.profile, ...(saved.profile || {}) },
          daily: saved.daily || {}, workouts: saved.workouts || {}, measurements: Array.isArray(saved.measurements) ? saved.measurements : []
        };
      } catch (error) {
        console.error('读取本地数据失败', error);
        return defaultState();
      }
    }

    let state = loadState();

    function saveState(message) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (message) toast(message);
      } catch (error) {
        console.error('保存失败', error);
        toast('保存失败，请先导出备份或清理浏览器空间', true);
      }
    }

    function toast(message, isError = false) {
      const region = document.getElementById('toastRegion');
      const el = document.createElement('div');
      el.className = `toast${isError ? ' error' : ''}`;
      el.setAttribute('role', 'status');
      el.textContent = message;
      region.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 200); }, 2600);
    }

    function route() {
      const value = location.hash.replace('#', '').split('?')[0];
      return ROUTES.has(value) ? value : 'today';
    }

    function weekFor(dateValue = localISO()) {
      const diff = Math.floor((parseLocal(dateValue) - parseLocal(state.profile.startDate)) / 86400000);
      if (diff < 0) return 0;
      return clamp(Math.floor(diff / 7) + 1, 1, 12);
    }

    function activityTargets(week = weekFor()) {
      const baseSteps = week <= 1 ? 6500 : week === 2 ? 7500 : 8000;
      const baseRun = week <= 1 ? 20 : week === 2 ? 25 : 30;
      return {
        steps: state.profile.stepOverride || baseSteps,
        run: state.profile.runOverride ?? baseRun,
        runs: 2,
        mode: state.profile.lowImpactMode ? '坡走、椭圆机或自行车' : '轻松跑'
      };
    }

    function workoutForWeekday(dateValue = localISO()) {
      const weekday = parseLocal(dateValue).getDay();
      return Object.entries(PROGRAM).find(([, plan]) => plan.weekday === weekday)?.[0] || null;
    }

    function dayLog(dateValue = localISO()) {
      return { calories: 0, protein: 0, fat: 0, carbs: 0, steps: 0, water: 0, vegetables: 0, fruit: 0, runMinutes: 0, friedChicken: false, notes: '', ...(state.daily[dateValue] || {}) };
    }

    function progressPercent(value, target) { return target > 0 ? clamp((number(value) / target) * 100, 0, 120) : 0; }

    function metric(label, value, target, unit, inverse = false) {
      const pct = progressPercent(value, target);
      const over = inverse && number(value) > target + 100;
      const digits = unit === 'L' ? 1 : 0;
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${round(value, digits)}<span class="metric-target"> ${unit}</span></div><div class="metric-target">目标 ${target} ${unit}</div><div class="progress" aria-label="${label}完成${round(pct, 0)}%"><span class="${over ? 'over' : ''}" style="width:${Math.min(pct, 100)}%"></span></div></div>`;

    function progressionFor(exercise, date, week) {
      const previous = previousExercise(exercise.id, date);
      if ([6, 12].includes(week)) return { text: '减量周：组数减半，重量用上次的90%–95%', weight: previous?.sets?.[0]?.weight || exercise.start || '' };
      if (!previous) return { text: exercise.start ? `首次建议从 ${exercise.start} kg 校准，保留3次余力` : '首次先找到能稳定完成且保留3次余力的重量', weight: exercise.start || '' };
      const finished = previous.sets?.filter(set => set.done) || [];
      const ready = finished.length > 0 && finished.every(set => number(set.reps) >= exercise.max && number(set.rir) >= 1 && number(set.rir) <= 2);
      const lastWeight = number(finished[0]?.weight);
      return ready && exercise.increment > 0
        ? { text: `上次已达上限，本次建议增加 ${exercise.increment} kg`, weight: lastWeight + exercise.increment }

    function renderExercise(exercise, session, week) {
      const sets = effectiveSets(exercise.sets, week);

        return `<div class="set-number">${index + 1}</div>

          <input aria-label="${exercise.name}第${index + 1}组完成" name="${exercise.id}.${index}.done" type="checkbox" ${set.done ? 'checked' : ''}>`;
      }).join('');
      return `<article class="exercise" data-exercise="${exercise.id}">
        <div class="exercise-head"><div><h3>${exercise.name}</h3><div class="progression-note">${progression.text}</div></div><div class="prescription">${sets} × ${exercise.min}–${exercise.max}</div></div>

    function measurementSeries(key) {
      return [...state.measurements].filter(item => number(item[key]) > 0).sort((a, b) => a.date.localeCompare(b.date));
    }

    function renderChart(items, key, unit) {
      if (items.length < 2) return `<div class="chart-empty"><strong>至少需要两次记录</strong><br>录入后会显示趋势，而不是单次波动。</div>`;
      const values = items.map(item => number(item[key]));
      const min = Math.min(...values); const max = Math.max(...values); const range = max - min || 1;
      const width = 680; const height = 210; const xPad = 44; const yPad = 30;
      const points = items.map((item, index) => {
        const x = xPad + (index / Math.max(1, items.length - 1)) * (width - xPad * 2);
        const y = yPad + ((max - number(item[key])) / range) * (height - yPad * 2);
        return { x, y, item };
      });
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${key === 'weight' ? '体重' : '腰围'}趋势图">
        <line class="chart-grid" x1="${xPad}" y1="${yPad}" x2="${xPad}" y2="${height - yPad}"/><line class="chart-grid" x1="${xPad}" y1="${height - yPad}" x2="${width - xPad}" y2="${height - yPad}"/>
        <polyline class="chart-line" points="${points.map(p => `${p.x},${p.y}`).join(' ')}"/>
        ${points.map((p, index) => `<circle class="chart-dot" cx="${p.x}" cy="${p.y}" r="4"><title>${p.item.date}: ${p.item[key]} ${unit}</title></circle>${(index === 0 || index === points.length - 1) ? `<text class="chart-label" x="${p.x}" y="${height - 8}" text-anchor="middle">${fmtDate(p.item.date)}</text><text class="chart-label" x="${p.x}" y="${p.y - 10}" text-anchor="middle">${p.item[key]}</text>` : ''}`).join('')}
      </svg>`;
    }

    function estimatedBench(item) { return number(item.benchWeight) * (1 + number(item.benchReps) / 30); }

    function recommendation() {
      const today = localISO(); const currentStart = plusDays(today, -6); const previousStart = plusDays(today, -13); const previousEnd = plusDays(today, -7);
      const recentPain = Object.values(state.workouts).some(session => session.date >= previousStart && session.date <= today && session.pain);
      if (recentPain && !state.profile.lowImpactMode) return { tone: 'bad', title: '先处理持续疼痛', text: '停止跑步，改为同等时长的坡走、椭圆机或自行车。锐痛持续或影响日常活动时寻求专业评估。', type: 'lowImpact' };
      const weights = measurementSeries('weight');
      const average = entries => entries.length ? entries.reduce((sum, item) => sum + number(item.weight), 0) / entries.length : null;
      const currentEntries = weights.filter(item => item.date >= currentStart && item.date <= today);
      const previousEntries = weights.filter(item => item.date >= previousStart && item.date <= previousEnd);
      const currentAvg = average(currentEntries); const previousAvg = average(previousEntries);
      const waistItems = measurementSeries('waist'); const recentWaist = waistItems.at(-1); const priorWaist = waistItems.length > 1 ? waistItems.at(-2) : null;
      const waistDelta = recentWaist && priorWaist ? number(recentWaist.waist) - number(priorWaist.waist) : null;
      const benchItems = [...state.measurements].filter(item => number(item.benchWeight) && number(item.benchReps)).sort((a, b) => a.date.localeCompare(b.date));
      const benchChange = benchItems.length > 1 ? ((estimatedBench(benchItems.at(-1)) - estimatedBench(benchItems.at(-2))) / estimatedBench(benchItems.at(-2))) * 100 : null;
      const loggedDays = Object.entries(state.daily).filter(([date, log]) => date >= previousStart && date <= today && number(log.calories) > 0);
      const adherentDays = loggedDays.filter(([, log]) => Math.abs(number(log.calories) - state.profile.calorieTarget) <= 100 && number(log.protein) >= state.profile.proteinTarget - 10).length;
      const adherence = loggedDays.length ? adherentDays / loggedDays.length * 100 : null;
      if (currentEntries.length < 3 || previousEntries.length < 3) return { tone: 'info', title: '继续收集数据', text: '最近两个7天周期各需要至少3次体重记录。现在不要调整热量。', type: null };
      const lossRate = ((previousAvg - currentAvg) / previousAvg) * 100;
      if (lossRate > .8 || (benchChange !== null && benchChange < -5)) return { tone: 'warn', title: '下降偏快或力量受影响', text: `周均下降 ${round(lossRate, 2)}%；建议每日增加150 kcal，优先加碳水，并把一次跑步缩短10分钟。`, type: 'calorieUp', detail: { lossRate, adherence, waistDelta, benchChange } };
      if (lossRate >= .3 && lossRate <= .6) return { tone: 'good', title: '速度合适，保持不变', text: `周均下降 ${round(lossRate, 2)}%，处在保肌目标区间。不要因为某一天体重反弹而改计划。`, type: null, detail: { lossRate, adherence, waistDelta, benchChange } };
      if (Math.abs(lossRate) < .2 && waistDelta !== null && waistDelta <= -.3 && (benchChange === null || benchChange >= -2)) return { tone: 'good', title: '正在发生身体重组', text: `体重变化小，但腰围下降 ${round(Math.abs(waistDelta), 1)} cm，力量稳定。保持现有热量与训练。`, type: null, detail: { lossRate, adherence, waistDelta, benchChange } };
      if (lossRate < .2 && waistDelta !== null && waistDelta > -.2) {
        if (adherence === null || loggedDays.length < 12 || adherence < 85) return { tone: 'warn', title: '先提高记录与执行率', text: `当前可验证执行率为 ${adherence === null ? '不足' : `${round(adherence, 0)}%`}；两周至少记录12天并达到85%，不要急着砍热量。`, type: null };
        if (activityTargets().steps < 9000) return { tone: 'warn', title: '先把步数提高到9000', text: `连续两周下降不足0.2%，腰围也未明显变化，且执行率 ${round(adherence, 0)}%。优先增加低疲劳活动。`, type: 'stepsUp' };
        if (state.profile.calorieTarget > 1900) return { tone: 'warn', title: '每日减少150 kcal', text: '步数已经达到9000，下一步把热量减少150 kcal；蛋白质保持不变，主要从脂肪或碳水中减。', type: 'calorieDown' };
        return { tone: 'bad', title: '暂停自动下调', text: '当前目标已接近1900 kcal下限。不要继续自行削减，请重新核对外卖、零食、饮料和称量误差。', type: null };
      }
      return { tone: 'info', title: '再观察一周', text: `当前周均变化 ${round(lossRate, 2)}%，暂不满足调整条件。保持计划并继续记录腰围与力量。`, type: null };
    }

    function renderProgress() {
      const weightItems = measurementSeries('weight'); const waistItems = measurementSeries('waist'); const advice = recommendation(); const currentWeek = weekFor() || 1;
      const latest = [...state.measurements].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12);
      return `${pageHead('趋势优先，不看单日', '让两周数据替你做决定', '每周至少称重3次、腰围1次；只有满足连续两周条件，才改变步数或热量。')}
        <section class="panel panel-pad" style="margin-bottom:var(--space-6)">
          <div class="panel-title"><div><span class="status ${advice.tone}">${advice.title}</span></div>${advice.type ? `<button class="button small-button" data-apply-advice="${advice.type}">应用建议</button>` : ''}</div>
          <p>${advice.text}</p>
        </section>
        <div class="dashboard-grid">
          <div class="stack-lg">
            <section class="panel panel-pad"><div class="panel-title"><h2>体重趋势</h2><span class="small muted">kg</span></div><div class="chart">${renderChart(weightItems, 'weight', 'kg')}</div></section>
            <section class="panel panel-pad"><div class="panel-title"><h2>腰围趋势</h2><span class="small muted">cm</span></div><div class="chart">${renderChart(waistItems, 'waist', 'cm')}</div></section>
          </div>
          <form id="measurementForm" class="panel panel-pad stack">
            <div class="panel-title"><h2>录入测量</h2></div>
            <div class="field"><label for="mDate">日期</label><input id="mDate" name="date" type="date" value="${localISO()}" required></div>
            <div class="form-grid">
              <div class="field"><label for="mWeight">体重 kg</label><input id="mWeight" name="weight" type="number" min="40" max="180" step="0.1" placeholder="例如 72.4"></div>
              <div class="field"><label for="mWaist">腰围 cm</label><input id="mWaist" name="waist" type="number" min="50" max="180" step="0.1" placeholder="例如 83.5"></div>
              <div class="field"><label for="mBenchWeight">卧推重量 kg</label><input id="mBenchWeight" name="benchWeight" type="number" min="0" max="300" step="0.5" placeholder="例如 55"></div>
              <div class="field"><label for="mBenchReps">完成次数</label><input id="mBenchReps" name="benchReps" type="number" min="0" max="30" placeholder="例如 6"></div>
            </div>
            <div class="field"><label for="mNote">备注</label><input id="mNote" name="note" type="text" maxlength="80" placeholder="同一台秤、训练前"></div>
            <button class="button" type="submit">保存测量</button>
          </form>
        </div>
        <section class="panel panel-pad" style="margin-top:var(--space-6)"><div class="panel-title"><h2>12周路线</h2><span class="small muted">第6、12周减量</span></div><div class="timeline">${Array.from({ length: 12 }, (_, index) => { const week = index + 1; const status = week < currentWeek ? 'done' : week === currentWeek ? 'current' : ''; return `<div class="week-node ${status}"><strong>W${week}</strong><span>${[6, 12].includes(week) ? '减量' : week === 1 ? '校准' : '推进'}</span></div>`; }).join('')}</div></section>
        <section class="panel panel-pad" style="margin-top:var(--space-6)"><div class="panel-title"><h2>最近记录</h2><span class="small muted">最多显示12条</span></div>${latest.length ? `<div class="data-table-wrap"><table><thead><tr><th>日期</th><th>体重</th><th>腰围</th><th>卧推</th><th></th></tr></thead><tbody>${latest.map(item => `<tr><td>${item.date}</td><td>${item.weight ? `${item.weight} kg` : '—'}</td><td>${item.waist ? `${item.waist} cm` : '—'}</td><td>${item.benchWeight ? `${item.benchWeight}×${item.benchReps || '—'}` : '—'}</td><td><button class="button ghost small-button" type="button" data-delete-measurement="${item.id}">删除</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><strong>还没有测量记录</strong>从今天的体重和腰围开始。</div>`}</section>`;
    }

    function renderSettings() {
      const p = state.profile;
      return `${pageHead('本机离线保存', '校准你的起点与目标', '数据只保存在当前浏览器。建议每周导出一次备份，避免清理浏览器后丢失记录。')}
        <div class="dashboard-grid">
          <form id="profileForm" class="panel panel-pad stack-lg">
            <div class="panel-title"><h2>个人与计划</h2></div>
            <div class="form-grid">
              <div class="field"><label for="pStart">计划开始日期</label><input id="pStart" name="startDate" type="date" value="${p.startDate}" required></div>
              <div class="field"><label for="pHeight">身高 cm</label><input id="pHeight" name="height" type="number" min="120" max="230" value="${p.height}" required></div>
              <div class="field"><label for="pWeight">起始体重 kg</label><input id="pWeight" name="startWeight" type="number" min="40" max="180" step="0.1" value="${p.startWeight ?? ''}" placeholder="健身房称重"></div>
              <div class="field"><label for="pWaist">起始腰围 cm</label><input id="pWaist" name="startWaist" type="number" min="50" max="180" step="0.1" value="${p.startWaist ?? ''}" placeholder="肚脐水平"></div>
            </div>
            <div class="panel-title" style="margin-bottom:0"><h2>每日目标</h2></div>
            <div class="form-grid cols-4">
              <div class="field"><label for="pCal">热量 kcal</label><input id="pCal" name="calorieTarget" type="number" min="1900" max="3500" step="50" value="${p.calorieTarget}"></div>
              <div class="field"><label for="pPro">蛋白质 g</label><input id="pPro" name="proteinTarget" type="number" min="80" max="250" step="5" value="${p.proteinTarget}"></div>
              <div class="field"><label for="pFat">脂肪 g</label><input id="pFat" name="fatTarget" type="number" min="40" max="150" step="5" value="${p.fatTarget}"></div>
              <div class="field"><label for="pCarb">碳水 g</label><input id="pCarb" name="carbTarget" type="number" min="100" max="500" step="5" value="${p.carbTarget}"></div>
            </div>
            <p class="input-help">默认按约70–75 kg设置：2150 kcal、蛋白质150 g、脂肪60 g、碳水250 g。准确体重若不在68–80 kg，请重新评估热量。</p>
            <label class="checkline"><input type="checkbox" name="lowImpactMode" ${p.lowImpactMode ? 'checked' : ''}>当前使用低冲击有氧（坡走、椭圆机或自行车）</label>
            ${number(p.startWeight) > 0 && (number(p.startWeight) < 68 || number(p.startWeight) > 80) ? `<div class="callout"><strong>2150 kcal 目前只是暂定值</strong><p class="small muted">你的起始体重不在68–80 kg估算范围内，请重新评估起始热量，不要机械套用默认值。</p></div>` : ''}
            <button class="button" type="submit">保存设置</button>
          </form>
          <aside class="stack-lg">
            <section class="panel panel-pad stack"><div class="panel-title"><h2>数据备份</h2></div><button class="button secondary" type="button" id="exportData">导出 JSON 备份</button><button class="button ghost" type="button" id="importData">导入备份</button><p class="small muted">导入会用备份覆盖当前数据；导入前会再次确认。</p></section>
            <section class="panel panel-pad danger-zone stack"><div class="panel-title"><h2>重新开始</h2></div><p class="small muted">清除全部训练、饮食和测量记录，无法撤销。</p><button class="button danger" type="button" id="resetData">清除全部数据</button></section>
          </aside>
        </div>
        <section class="panel panel-pad" style="margin-top:var(--space-6)">
          <div class="panel-title"><h2>使用边界与依据</h2></div>
          <div class="callout" style="margin-bottom:var(--space-4)"><p>这是健康成人的自我管理工具，不替代医生或注册营养师。出现胸痛、眩晕、异常气短或持续关节锐痛时停止训练并就医；有肾病、肝病、进食障碍或运动禁忌时，不直接使用本方案。</p></div>
          <div class="source-list"><a href="https://acsm.org/resistance-training-guidelines-update-2026/" target="_blank" rel="noreferrer">ACSM 2026 抗阻训练指南</a><a href="https://pubmed.ncbi.nlm.nih.gov/21558571/" target="_blank" rel="noreferrer">运动员渐进减重速度研究</a><a href="https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0177-8" target="_blank" rel="noreferrer">ISSN 蛋白质立场声明</a><a href="https://www.who.int/publications/i/item/9789240014886" target="_blank" rel="noreferrer">WHO 身体活动指南</a></div>
        </section>`;
    }

    function updateActiveNav() {
      const current = route();
      document.querySelectorAll('[data-route]').forEach(link => link.setAttribute('aria-current', link.dataset.route === current ? 'page' : 'false'));
    }

    function render() {
      const views = { today: renderToday, training: renderTraining, nutrition: renderNutrition, progress: renderProgress, settings: renderSettings };
      const current = route();
      document.getElementById('app').innerHTML = views[current]();
      updateActiveNav();
      bindView(current);
    }

    function formNumbers(form, fields) {
      return Object.fromEntries(fields.map(field => [field, number(new FormData(form).get(field))]));
    }

    function bindView(current) {
      if (current === 'today') {
        document.getElementById('quickLog')?.addEventListener('submit', event => {
          event.preventDefault(); const date = localISO(); const values = formNumbers(event.currentTarget, ['calories', 'protein', 'steps', 'water']);
          state.daily[date] = { ...dayLog(date), ...values }; saveState('今天的记录已保存'); render();
        });
        document.querySelector('[data-go-training]')?.addEventListener('click', event => { state.selectedTrainingDay = event.currentTarget.dataset.goTraining; saveState(); location.hash = '#training'; });
      }

      if (current === 'training') {
        document.querySelectorAll('[data-select-day]').forEach(button => button.addEventListener('click', () => { state.selectedTrainingDay = button.dataset.selectDay; saveState(); render(); }));
        document.getElementById('sessionDate')?.addEventListener('change', event => {
          const oldKey = sessionKey(localISO(), state.selectedTrainingDay); const newKey = sessionKey(event.target.value, state.selectedTrainingDay);
          if (state.workouts[newKey]) { renderSessionForDate(event.target.value); } else if (state.workouts[oldKey]) { /* preserve current until submit */ }
        });
        document.getElementById('workoutForm')?.addEventListener('submit', saveWorkout);
      }

      if (current === 'nutrition') {
        document.getElementById('nutritionForm')?.addEventListener('submit', event => {
          event.preventDefault(); const form = event.currentTarget; const date = localISO();
          const values = formNumbers(form, ['calories', 'protein', 'fat', 'carbs', 'steps', 'water', 'vegetables', 'fruit', 'runMinutes']);
          const monday = plusDays(date, -((parseLocal(date).getDay() + 6) % 7));
          const otherChickenMeals = Object.entries(state.daily).filter(([day, value]) => day >= monday && day !== date && value.friedChicken).length;
          state.daily[date] = { ...dayLog(date), ...values, friedChicken: form.friedChicken.checked, notes: form.notes.value.trim() };
          saveState(form.friedChicken.checked && otherChickenMeals >= 1 ? '已保存；本周炸鸡超过一次，下一餐恢复正常计划即可' : '饮食记录已保存'); render();
        });
        document.getElementById('calcTakeout')?.addEventListener('click', () => {
          const estimate = number(document.getElementById('takeoutEstimate').value); if (!estimate) return toast('先填写软件显示的热量', true);
          const result = Math.round(estimate * 1.15); document.getElementById('takeoutResult').textContent = `${result} kcal`; document.getElementById('nCalories').value = result;
        });
      }

      if (current === 'progress') {
        document.getElementById('measurementForm')?.addEventListener('submit', event => {
          event.preventDefault(); const form = event.currentTarget; const data = new FormData(form);
          const item = { id: `${data.get('date')}-${Date.now()}`, date: data.get('date'), weight: number(data.get('weight')) || null, waist: number(data.get('waist')) || null, benchWeight: number(data.get('benchWeight')) || null, benchReps: number(data.get('benchReps')) || null, note: String(data.get('note') || '').trim() };
          if (!item.weight && !item.waist && !item.benchWeight) return toast('至少填写体重、腰围或卧推中的一项', true);
          state.measurements.push(item); state.measurements.sort((a, b) => a.date.localeCompare(b.date)); saveState('测量记录已保存'); render();
        });
        document.querySelectorAll('[data-delete-measurement]').forEach(button => button.addEventListener('click', () => { state.measurements = state.measurements.filter(item => item.id !== button.dataset.deleteMeasurement); saveState('记录已删除'); render(); }));
        document.querySelector('[data-apply-advice]')?.addEventListener('click', event => applyAdvice(event.currentTarget.dataset.applyAdvice));
      }

      if (current === 'settings') {
        document.getElementById('profileForm')?.addEventListener('submit', event => {
          event.preventDefault(); const form = event.currentTarget; const data = new FormData(form);
          const values = formNumbers(form, ['height', 'startWeight', 'startWaist', 'calorieTarget', 'proteinTarget', 'fatTarget', 'carbTarget']);
          state.profile = { ...state.profile, ...values, startDate: String(data.get('startDate')), lowImpactMode: form.lowImpactMode.checked };
          if (state.profile.calorieTarget < 1900) state.profile.calorieTarget = 1900;
          if ((values.startWeight || values.startWaist) && !state.measurements.some(item => item.date === state.profile.startDate && (item.weight || item.waist))) {
            state.measurements.push({ id: `${state.profile.startDate}-baseline`, date: state.profile.startDate, weight: values.startWeight || null, waist: values.startWaist || null, benchWeight: null, benchReps: null, note: '计划起始基线' });
            state.measurements.sort((a, b) => a.date.localeCompare(b.date));
          }
          saveState('设置已保存'); render();
        });
        document.getElementById('exportData')?.addEventListener('click', exportData);
        document.getElementById('importData')?.addEventListener('click', () => document.getElementById('importInput').click());
        document.getElementById('resetData')?.addEventListener('click', resetData);
      }
    }

    function renderSessionForDate(date) {
      const key = sessionKey(date, state.selectedTrainingDay); const session = state.workouts[key];
      if (!session) return;
      document.getElementById('sessionNotes').value = session.notes || '';
      document.getElementById('sessionDuration').value = session.duration || '';
      document.querySelector('[name="pain"]').checked = Boolean(session.pain);
      document.querySelector('[name="completed"]').checked = Boolean(session.completed);
      Object.entries(session.entries || {}).forEach(([exerciseId, entry]) => entry.sets.forEach((set, index) => {
        ['weight', 'reps', 'rir'].forEach(field => { const input = document.querySelector(`[name="${exerciseId}.${index}.${field}"]`); if (input) input.value = set[field] ?? ''; });
        const done = document.querySelector(`[name="${exerciseId}.${index}.done"]`); if (done) done.checked = Boolean(set.done);
      }));
      toast('已载入该日期的训练记录');
    }

    function saveWorkout(event) {
      event.preventDefault(); const form = event.currentTarget; const data = new FormData(form); const date = String(data.get('sessionDate')); const dayId = state.selectedTrainingDay; const plan = PROGRAM[dayId]; const week = weekFor(date) || 1; const entries = {};
      plan.exercises.forEach(exercise => {
        const sets = Array.from({ length: effectiveSets(exercise.sets, week) }, (_, index) => ({
          weight: number(data.get(`${exercise.id}.${index}.weight`)) || null,
          reps: number(data.get(`${exercise.id}.${index}.reps`)) || null,
          rir: data.get(`${exercise.id}.${index}.rir`) === '' ? null : number(data.get(`${exercise.id}.${index}.rir`)),
          done: data.get(`${exercise.id}.${index}.done`) === 'on'
        }));
        entries[exercise.id] = { sets };
      });
      const pain = data.get('pain') === 'on';
      state.workouts[sessionKey(date, dayId)] = { date, dayId, entries, duration: number(data.get('duration')) || null, pain, notes: String(data.get('sessionNotes') || '').trim(), completed: data.get('completed') === 'on' };
      saveState(pain ? '训练已保存；请立即把跑步改为低冲击有氧' : '训练记录已保存'); render();
    }

    function applyAdvice(type) {
      if (type === 'stepsUp') state.profile.stepOverride = 9000;
      if (type === 'calorieDown') state.profile.calorieTarget = Math.max(1900, state.profile.calorieTarget - 150);
      if (type === 'calorieUp') { state.profile.calorieTarget += 150; state.profile.runOverride = Math.max(10, activityTargets().run - 10); }
      if (type === 'lowImpact') state.profile.lowImpactMode = true;
      saveState('调整已应用到计划'); render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const link = document.createElement('a');
      link.href = url; link.download = `稳进备份-${localISO()}.json`; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); toast('备份已导出');
    }

    function resetData() {
      if (!confirm('确定清除全部记录吗？此操作无法撤销。')) return;
      state = defaultState(); saveState(); render(); toast('全部数据已清除');
    }

    document.getElementById('importInput').addEventListener('change', async event => {
      const file = event.target.files?.[0]; if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed.version !== 1 || !parsed.profile || !parsed.daily || !parsed.workouts || !Array.isArray(parsed.measurements)) throw new Error('备份格式不兼容');
        if (!confirm('导入会覆盖当前数据，确定继续吗？')) return;
        state = { ...defaultState(), ...parsed, profile: { ...defaultState().profile, ...parsed.profile } }; saveState(); render(); toast('备份已导入');
      } catch (error) { console.error(error); toast('导入失败：请选择由本应用导出的JSON文件', true); }
      finally { event.target.value = ''; }
    });

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY); const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem(THEME_KEY, next);
    });
    window.addEventListener('hashchange', render);
    window.addEventListener('error', event => { console.error(event.error); toast('页面出现错误，请导出备份后刷新', true); });

    initTheme();
    if (!location.hash) location.hash = '#today'; else render();
  </script>
</body>
</html>
